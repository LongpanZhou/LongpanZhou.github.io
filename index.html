<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#010a13" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longpan Zhou | Software Developer</title>
    <meta name="description" content="Longpan Zhou's portfolio — an immersive 3D Summoner's Rift experience showcasing projects in deep learning, kernel development, 3D graphics, and web development." />
    <!-- The page is dark from its first paint, before any stylesheet has arrived. The notice below is
         all a phone or tablet is shown: the site needs a mouse and a large screen. -->
    <style>
      html { background: #0a1428; }
      body { margin: 0; }
      #mobile-notice { display: none; }
      .is-mobile #mobile-notice {
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        color: #c8aa6e;
        font-family: "Beaufort for LOL", "Times New Roman", serif;
      }
      #mobile-notice h1 { font-size: 22px; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
      #mobile-notice p { color: #a09b8c; max-width: 320px; line-height: 1.6; margin: 0; }
    </style>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Longpan Zhou | Software Developer" />
    <meta property="og:description" content="Portfolio featuring projects in deep learning, kernel development, 3D graphics, and web development." />
    <meta property="og:url" content="https://longpanzhou.github.io" />
    <meta property="og:image" content="https://longpanzhou.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Longpan Zhou | Software Developer" />
    <meta name="twitter:description" content="Portfolio featuring projects in deep learning, kernel development, 3D graphics, and web development." />
    <meta name="twitter:image" content="https://longpanzhou.github.io/og.png" />
    <script type="module" crossorigin src="/assets/index-ByEjCikm.js"></script>
  </head>
  <body>
    <!-- GitHub Pages SPA redirect resolver -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <!-- Everything the page is known to need is asked for here, at once, so the downloads run side by
         side. Left to itself the page finds them one after another: its entry script, then the site's
         code, then the map's code, then the map. A phone or tablet gets none of it, only the notice. -->
    <script>
      (function (l) {
        if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
          document.documentElement.className = 'is-mobile';
          return;
        }
        var add = function (rel, href, as, cross) {
          var link = document.createElement('link');
          link.rel = rel;
          if (as) link.as = as;
          if (cross) link.crossOrigin = 'anonymous';
          link.href = href;
          document.head.appendChild(link);
        };
        var code = function (files) {
          files.forEach(function (f) {
            if (/\.css$/.test(f)) add('preload', f, 'style');
            else add('modulepreload', f, '', true);
          });
        };
        // The build writes the file names in (see vite.config.ts). The dev server leaves the lists empty.
        var files = {"site":["/assets/desktop-D7mB1gJx.js","/assets/desktop-BmbzhQ_q.css"],"map":["/assets/SummonersRift-3TFaxXMs.js","/assets/SummonersRift-DPhfX6de.css","/assets/DrawFrame-CqWKBbbN.js","/assets/DrawFrame-D6h_y-QK.css"]};
        code(files.site);
        // The addresses that show the map, where it is by far the largest download
        var isMap = !/^\/(welcome|profile|animalclicks)\/?$/.test(l.pathname) && !/^\/blog\/./.test(l.pathname);
        if (isMap) {
          code(files.map);
          add('preload', '/rift-opt.glb', 'fetch', true);
        }
        // The profile page's font, added here so its stylesheet never holds up the first paint
        add('preconnect', 'https://fonts.gstatic.com', '', true);
        add('stylesheet', 'https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
      })(window.location);
    </script>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; color: #f0e6d2; background: #010a13">
        Longpan Zhou, software developer. This portfolio is an interactive 3D page and needs JavaScript. Projects are
        on <a href="https://github.com/LongpanZhou" style="color: #c8aa6e">github.com/LongpanZhou</a>.
      </p>
    </noscript>
    <div id="mobile-notice">
      <h1>Desktop only</h1>
      <p>This website isn't available on mobile devices. Please visit it from a desktop or laptop browser.</p>
    </div>
    <div id="root"></div>
  </body>
</html>
